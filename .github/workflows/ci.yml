name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run lint, unit tests, and debug build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug
      # Unsigned release build: exercises R8 and the Gson keep rules in proguard-rules.pro.
      - name: Build release (R8)
        run: ./gradlew assembleRelease
